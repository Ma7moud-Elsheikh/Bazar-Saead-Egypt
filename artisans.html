<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>الحرفيون — بازار صعيد مصر</title>
        <!-- favicon -->
        <link rel="shortcut icon" href="img/logo.png" type="image/x-icon" />
        <meta
            name="description"
            content="تعرف على حرفيي صعيد مصر الموهوبين — أصحاب الأيدي الذهبية من أسوان إلى المنيا."
        />
        <meta property="og:site_name" content="بازار صعيد مصر" />
        <meta property="og:title" content="الحرفيون — بازار صعيد مصر" />
        <meta property="og:type" content="website" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lenis/1.1.9/lenis.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link rel="stylesheet" href="css/shared.css" />
        <link rel="canonical" href="https://bazarsa3eed.com/artisans.html" />
        <meta
            property="og:image"
            content="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=1200&h=630&fit=crop&auto=format"
        />
        <meta property="og:url" content="https://bazarsa3eed.com/artisans.html" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="بازار صعيد مصر" />
        <meta name="theme-color" content="#B87333" />
    </head>
    <body>
        <div class="grain-overlay" aria-hidden="true"></div>
        <div id="cursor" aria-hidden="true"></div>
        <div id="cursor-follower" aria-hidden="true"></div>
        <div id="page-transition" aria-hidden="true"></div>
        <header><nav id="navbar" aria-label="التنقل الرئيسي"></nav></header>
        <div id="mobile-menu" role="dialog" aria-modal="true"></div>

        <main id="main-content">
            <section class="page-hero" aria-labelledby="page-h1">
                <div class="page-hero-bg" aria-hidden="true"></div>
                <div class="page-hero-content">
                    <h1 id="page-h1" data-ar="الحرفيون" data-en="Artisans">الحرفيون</h1>
                    <p
                        data-ar="أصحاب الأيدي الذهبية — حكّاء الطين والخيط والنحاس والخشب."
                        data-en="The golden hands — storytellers of clay, thread, copper, and wood."
                    >
                        أصحاب الأيدي الذهبية — حكّاء الطين والخيط والنحاس والخشب.
                    </p>
                </div>
            </section>

            <div class="filters-wrap" role="group" aria-label="تصفية حسب المنطقة">
                <span class="filter-label" data-ar="المنطقة:" data-en="Region:">المنطقة:</span>
                <button
                    class="filter-btn active"
                    data-filter="all"
                    aria-pressed="true"
                    data-ar="الكل"
                    data-en="All"
                >
                    الكل
                </button>
                <button
                    class="filter-btn"
                    data-filter="aswan"
                    aria-pressed="false"
                    data-ar="أسوان"
                    data-en="Aswan"
                >
                    أسوان
                </button>
                <button
                    class="filter-btn"
                    data-filter="luxor"
                    aria-pressed="false"
                    data-ar="الأقصر"
                    data-en="Luxor"
                >
                    الأقصر
                </button>
                <button
                    class="filter-btn"
                    data-filter="qena"
                    aria-pressed="false"
                    data-ar="قنا"
                    data-en="Qena"
                >
                    قنا
                </button>
                <button
                    class="filter-btn"
                    data-filter="sohag"
                    aria-pressed="false"
                    data-ar="سوهاج"
                    data-en="Sohag"
                >
                    سوهاج
                </button>
                <button
                    class="filter-btn"
                    data-filter="asyut"
                    aria-pressed="false"
                    data-ar="أسيوط"
                    data-en="Asyut"
                >
                    أسيوط
                </button>
                <button
                    class="filter-btn"
                    data-filter="minya"
                    aria-pressed="false"
                    data-ar="المنيا"
                    data-en="Minya"
                >
                    المنيا
                </button>
            </div>

            <div
                class="artisans-page"
                id="artisans-grid"
                aria-live="polite"
                aria-label="قائمة الحرفيين"
            >
                <div class="skeleton skeleton--artisan"></div>
                <div class="skeleton skeleton--artisan"></div>
                <div class="skeleton skeleton--artisan"></div>
            </div>
        </main>

        <footer role="contentinfo"></footer>

        <script src="js/shared.js"></script>
        <script src="js/enhancements.js"></script>
        <script src="js/cart.js"></script>
        <script>
            gsap.registerPlugin(ScrollTrigger);
            let allArtisans = [];

            function buildCard(a, lang) {
                return `
  <article class="artisan-card-full">
    <a href="artisan-single.html?id=${a.id}" aria-label="${a.name[lang]}">
      <div class="artisan-img-wrap">
        <div class="artisan-badge">
    ${lang === 'ar'
        ? 'حرفي تراثي'
        : 'Heritage Artisan'}
</div>
        <img class="artisan-img-inner" src="${a.portrait}" alt="${a.name[lang]}" loading="lazy"/>
        <div class="artisan-img-overlay">
          <h3 class="artisan-card-name" data-ar="${a.name.ar}" data-en="${a.name.en}">${a.name[lang]}</h3>
          <p class="artisan-card-region" data-ar="${a.region.ar}" data-en="${a.region.en}">${a.region[lang]}</p>
        </div>
      </div>
      <p class="artisan-card-story" data-ar="${a.story.ar}" data-en="${a.story.en}">${a.story[lang]}</p>
      <div class="artisan-card-footer">

    <span class="artisan-card-note">
        ${lang === 'ar'
            ? 'حرفي معتمد'
            : 'Verified Artisan'}
    </span>

    <span class="artisan-card-cta">
        <span
            data-ar="عرض الأعمال"
            data-en="View Works"
        >
            ${lang === 'ar'
                ? 'عرض الأعمال'
                : 'View Works'}
        </span>
        <i class="fa-solid fa-arrow-right"></i>
    </span>

</div>
    </a>
  </article>`;
            }

            function renderGrid(list) {
                const grid = document.getElementById('artisans-grid');
                const lang = i18n.currentLang;
                if (!list.length) {
                    grid.innerHTML = `<div class="empty-grid" data-ar="لا يوجد حرفيون في هذه المنطقة حالياً." data-en="No artisans in this region yet.">${lang === 'ar' ? 'لا يوجد حرفيون في هذه المنطقة حالياً.' : 'No artisans in this region yet.'}</div>`;
                    return;
                }
                grid.innerHTML = list.map((a) => buildCard(a, lang)).join('');
                initReveal();
                window._onContentLoaded?.();
                gsap.from('#artisans-grid article', {
                    opacity: 0,
                    y: 48,
                    duration: 0.65,
                    stagger: 0.09,
                    ease: 'power2.out',
                    clearProps: 'opacity,transform',
                    scrollTrigger: { trigger: '#artisans-grid', start: 'top 85%', once: true }
                });
            }

            document.querySelectorAll('.filter-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach((b) => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                    const f = btn.dataset.filter;
                    renderGrid(
                        f === 'all' ? allArtisans : allArtisans.filter((a) => a.regionKey === f)
                    );
                });
            });

            async function init() {
                try {
                    allArtisans = await fetch('data/artisans.json').then((r) => r.json());
                    const p = new URLSearchParams(location.search).get('region');
                    if (p) {
                        const btn = document.querySelector(`[data-filter="${p}"]`);
                        if (btn) btn.click();
                    } else {
                        renderGrid(allArtisans);
                    }
                } catch (e) {
                    document.getElementById('artisans-grid').innerHTML = '<p >تعذّر التحميل</p>';
                }
            }
            init();
        </script>
    </body>
</html>

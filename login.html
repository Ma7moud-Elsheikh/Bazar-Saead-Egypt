<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>تسجيل الدخول — بازار صعيد مصر</title>
        <meta name="description" content="سجّل دخولك إلى بازار صعيد مصر." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
            media="print"
            onload="this.media = 'all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
            />
        </noscript>
        <link rel="stylesheet" href="css/shared.css" />
        <link rel="canonical" href="https://bazarsa3eed.com/login.html" />
        <meta property="og:title" content="تسجيل الدخول — بازار صعيد مصر" />
        <meta property="og:description" content="سجّل دخولك إلى بازار صعيد مصر." />
        <meta
            property="og:image"
            content="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=1200&h=630&fit=crop&auto=format"
        />
        <meta property="og:url" content="https://bazarsa3eed.com/login.html" />
        <meta name="twitter:card" content="summary" />
        <meta name="theme-color" content="#B87333" />
    </head>
    <body>
        <div class="grain-overlay" aria-hidden="true"></div>
        <div id="cursor" aria-hidden="true"></div>
        <div id="cursor-follower" aria-hidden="true"></div>
        <div id="page-transition" aria-hidden="true"></div>

        <nav class="auth-nav" aria-label="شعار الموقع">
            <a href="index.html" class="auth-nav-logo">
                <span data-ar="بازار" data-en="Bazar">بازار</span>
                <span class="highlight" data-ar="صعيد" data-en="Sa3eed">صعيد</span>
                <span data-ar="مصر" data-en="Masr">مصر</span>
            </a>
            <button id="lang-toggle" aria-label="Switch to English">EN</button>
        </nav>

        <main id="main-content">
            <div class="auth-wrap">
                <div class="auth-visual" aria-hidden="true">
                    <img
                        loading="lazy"
                        src="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=800&h=1200&fit=crop"
                        alt=""
                    />
                    <div class="auth-visual-overlay">
                        <p
                            class="auth-quote"
                            data-ar="«الحرفة ليست مهنة، هي هوية»"
                            data-en="«A craft is not a profession, it is an identity»"
                        >
                            «الحرفة ليست مهنة، هي هوية»
                        </p>
                        <span
                            class="auth-quote-credit"
                            data-ar="روح صعيد مصر"
                            data-en="Spirit of Upper Egypt"
                        >
                            روح صعيد مصر
                        </span>
                    </div>
                </div>

                <div class="auth-form-side">
                    <div class="auth-form-inner">
                        <h1 data-ar="أهلاً بعودتك" data-en="Welcome Back">أهلاً بعودتك</h1>
                        <p class="auth-sub">
                            <span data-ar="ليس لديك حساب؟ " data-en="No account? ">
                                ليس لديك حساب؟
                            </span>
                            <a href="register.html" data-ar="إنشاء حساب" data-en="Create one">
                                إنشاء حساب
                            </a>
                        </p>

                        <form novalidate aria-labelledby="login-heading" onsubmit="return false;">
                            <div class="fg">
                                <label class="fl" for="l-email">
                                    <span data-ar="البريد الإلكتروني" data-en="Email">
                                        البريد الإلكتروني
                                    </span>
                                </label>
                                <input
                                    class="fi"
                                    id="l-email"
                                    type="email"
                                    required
                                    autocomplete="email"
                                    data-ar-placeholder="example@email.com"
                                    data-en-placeholder="example@email.com"
                                    placeholder="example@email.com"
                                />
                            </div>
                            <div class="fg">
                                <label class="fl" for="l-pw">
                                    <span data-ar="كلمة المرور" data-en="Password">
                                        كلمة المرور
                                    </span>
                                    <a href="#" data-ar="نسيت؟" data-en="Forgot?">نسيت؟</a>
                                </label>
                                <div class="pw-wrap">
                                    <input
                                        class="fi"
                                        id="l-pw"
                                        type="password"
                                        required
                                        autocomplete="current-password"
                                        data-ar-placeholder="كلمة المرور"
                                        data-en-placeholder="Your password"
                                        placeholder="كلمة المرور"
                                        class="pw-field"
                                    />
                                    <button
                                        type="button"
                                        class="eye-btn"
                                        aria-label="إظهار كلمة المرور"
                                        onclick="
                                            var i = document.getElementById('l-pw');
                                            i.type = i.type === 'password' ? 'text' : 'password';
                                        "
                                    >
                                        <svg viewBox="0 0 24 24">
                                            <path
                                                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                            />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="check-wrap">
                                <input type="checkbox" id="remember" />
                                <label for="remember" data-ar="تذكرني" data-en="Remember me">
                                    تذكرني
                                </label>
                            </div>
                            <button
                                type="submit"
                                class="auth-btn"
                                data-ar="تسجيل الدخول"
                                data-en="Sign In"
                            >
                                تسجيل الدخول
                            </button>
                        </form>

                        <div class="auth-divider" data-ar="أو" data-en="or">أو</div>
                        <div class="social-btns">
                            <button type="button" class="social-btn" aria-label="الدخول بـ Google">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                        fill="#4285F4"
                                    />
                                    <path
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                        fill="#34A853"
                                    />
                                    <path
                                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                        fill="#FBBC05"
                                    />
                                    <path
                                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                        fill="#EA4335"
                                    />
                                </svg>
                                <span data-ar="المتابعة بـ Google" data-en="Continue with Google">
                                    المتابعة بـ Google
                                </span>
                            </button>
                            <button
                                type="button"
                                class="social-btn"
                                aria-label="الدخول بـ Facebook"
                            >
                                <svg viewBox="0 0 24 24" fill="#1877F2">
                                    <path
                                        d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                                    />
                                </svg>
                                <span
                                    data-ar="المتابعة بـ Facebook"
                                    data-en="Continue with Facebook"
                                >
                                    المتابعة بـ Facebook
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="js/shared.js"></script>
        <script src="js/enhancements.js"></script>
        <script>
            // Auth pages don't use the full navbar/footer injection
            document.getElementById('lang-toggle').addEventListener('click', () => i18n.toggle());
            i18n.init();
            initCursor();
            initPageTransitions();
        </script>
    </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>الحرفي — بازار صعيد مصر</title>
        <meta
            name="description"
            content="تعرف على حرفي من حرفيي بازار صعيد مصر وأعماله اليدوية الأصيلة."
        />
        <meta property="og:site_name" content="بازار صعيد مصر" />
        <meta property="og:type" content="profile" />
        <meta property="og:title" content="الحرفي — بازار صعيد مصر" />
        <meta
            property="og:description"
            content="تعرف على حرفي من حرفيي بازار صعيد مصر وأعماله اليدوية الأصيلة."
        />
        <meta
            property="og:image"
            content="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=1200&h=630&fit=crop&auto=format"
        />
        <meta property="og:url" content="https://bazarsa3eed.com/artisan-single.html" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="theme-color" content="#B87333" />
        <link rel="canonical" href="https://bazarsa3eed.com/artisan-single.html" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@400;500&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
            media="print"
            onload="this.media = 'all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
            />
        </noscript>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lenis/1.1.9/lenis.min.js"></script>
        <link rel="stylesheet" href="css/shared.css" />
    </head>
    <body>
        <a href="#main-content" class="skip-link" data-ar="انتقل للمحتوى" data-en="Skip to content">
            انتقل للمحتوى
        </a>
        <div class="grain-overlay" aria-hidden="true"></div>
        <div id="cursor" aria-hidden="true"></div>
        <div id="cursor-follower" aria-hidden="true"></div>
        <div id="page-transition" aria-hidden="true"></div>
        <header><nav id="navbar" aria-label="التنقل الرئيسي"></nav></header>
        <div id="mobile-menu" role="dialog" aria-modal="true" aria-label="قائمة التنقل"></div>

        <main id="main-content">
            <!-- Skeleton -->
            <div id="artisan-skeleton">
                <div class="skeleton--artisan-single-wrap">
                    <div class="skeleton--artisan-single-left">
                        <div class="skeleton skeleton--dark-xs"></div>
                        <div class="skeleton skeleton--dark-hero"></div>
                        <div class="skeleton skeleton--dark-sm"></div>
                        <div class="skeleton skeleton--dark-sm-short"></div>
                        <div class="skeleton skeleton--dark-btn"></div>
                    </div>
                    <div class="skeleton skeleton--artisan-single-right"></div>
                </div>
            </div>
            <!-- Content -->
            <div id="artisan-content" hidden></div>
        </main>

        <!-- Lightbox -->
        <div id="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصورة بالحجم الكامل">
            <button id="lb-close" aria-label="إغلاق الصورة">✕</button>
            <img id="lb-img" src="" alt="" />
        </div>

        <footer role="contentinfo"></footer>
        <button id="audio-toggle" aria-label="تشغيل الموسيقى المحيطة">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path
                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
                />
            </svg>
        </button>

        <script src="js/shared.js"></script>
        <script src="js/enhancements.js"></script>
        <script>
            gsap.registerPlugin(ScrollTrigger);

            // ── Lightbox ─────────────────────────────────────────────────────
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lb-img');
            document.getElementById('lb-close').addEventListener('click', () => closeLightbox());
            lb.addEventListener('click', (e) => {
                if (e.target === lb) closeLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeLightbox();
            });
            function openLightbox(src, alt) {
                lbImg.src = src;
                lbImg.alt = alt;
                lb.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
            function closeLightbox() {
                lb.classList.remove('open');
                document.body.style.overflow = '';
                lbImg.src = '';
            }

            // ── Load Artisan ──────────────────────────────────────────────────
            async function loadArtisan() {
                const id = new URLSearchParams(location.search).get('id');
                if (!id) {
                    location.href = 'artisans.html';
                    return;
                }

                try {
                    const artisans = await fetch('data/artisans.json').then((r) => r.json());
                    const a = artisans.find((x) => x.id === id);
                    if (!a) {
                        location.href = 'artisans.html';
                        return;
                    }

                    const lang = i18n.currentLang;

                    // ── SEO meta ──────────────────────────────────────────────────
                    setPageMeta({
                        title: `${a.name[lang]} — بازار صعيد مصر`,
                        description: a.story[lang].slice(0, 155) + '…',
                        ogTitle: `${a.name[lang]} — بازار صعيد مصر`,
                        ogDescription: a.story[lang].slice(0, 155) + '…',
                        ogImage: a.portrait,
                        ogType: 'profile'
                    });
                    let can = document.querySelector('link[rel="canonical"]');
                    if (!can) {
                        can = document.createElement('link');
                        can.rel = 'canonical';
                        document.head.appendChild(can);
                    }
                    can.href = `https://bazarsa3eed.com/artisan-single.html?id=${id}`;

                    // ── Works gallery ─────────────────────────────────────────────
                    const worksHTML = a.works
                        .map(
                            (w, i) => `
      <article class="work-card">
        <button class="work-open-btn"
                onclick="openLightbox('${w.images[0]}','${w.name[lang].replace(/'/g, '&#39;')}')"
                aria-label="${w.name[lang]} — ${lang === 'ar' ? 'اضغط لعرض الصورة' : 'Click to view image'}">
          <img src="${w.images[0]}" alt="${w.name[lang]}"
               loading="${i < 3 ? 'eager' : 'lazy'}" width="600" height="600"/>
          <div class="work-overlay" aria-hidden="true">
            <h3 class="work-name"
                data-ar="${w.name.ar}" data-en="${w.name.en}">${w.name[lang]}</h3>
            <p class="work-price">${w.price.toLocaleString('ar-EG')} ${lang === 'ar' ? 'جنيه' : 'EGP'}</p>
            <p class="work-desc"
               data-ar="${w.description.ar}" data-en="${w.description.en}">${w.description[lang]}</p>
          </div>
        </button>
      </article>`
                        )
                        .join('');

                    // ── Main HTML ─────────────────────────────────────────────────
                    document.getElementById('artisan-content').innerHTML = `
      <section class="profile-hero" aria-labelledby="artisan-h1">
        <div class="profile-left reveal">
          <nav aria-label="Breadcrumb">
            <ol class="breadcrumb">
              <li><a href="index.html" class="breadcrumb__link" data-ar="الرئيسية" data-en="Home">${lang === 'ar' ? 'الرئيسية' : 'Home'}</a></li>
              <li class="breadcrumb__sep" aria-hidden="true">/</li>
              <li><a href="artisans.html" class="breadcrumb__link" data-ar="الحرفيون" data-en="Artisans">${lang === 'ar' ? 'الحرفيون' : 'Artisans'}</a></li>
              <li class="breadcrumb__sep" aria-hidden="true">/</li>
              <li class="breadcrumb__current" aria-current="page">${a.name[lang]}</li>
            </ol>
          </nav>
          <span class="profile-badge"
                data-ar="${a.region.ar}" data-en="${a.region.en}">${a.region[lang]}</span>
          <h1 class="profile-name" id="artisan-h1"
              data-ar="${a.name.ar}" data-en="${a.name.en}">${a.name[lang]}</h1>
          <p class="profile-story"
             data-ar="${a.story.ar.replace(/"/g, '&quot;')}"
             data-en="${a.story.en.replace(/"/g, '&quot;')}">${a.story[lang]}</p>
          <a href="tel:${a.phone}" class="btn btn-primary"
             aria-label="${lang === 'ar' ? 'اتصل بـ' : 'Call'} ${a.name[lang]}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <span data-ar="تواصل معه" data-en="Get in Touch">
              ${lang === 'ar' ? 'تواصل معه' : 'Get in Touch'}
            </span>
          </a>
        </div>
        <div class="profile-right">
          <img src="${a.portrait}" alt="${lang === 'ar' ? 'صورة ' : 'Portrait of '}${a.name[lang]}"
               fetchpriority="high" width="800" height="800"/>
        </div>
      </section>

      <div class="profile-stats" role="list" aria-label="${lang === 'ar' ? 'إحصائيات الحرفي' : 'Artisan stats'}">
        <div class="profile-stat" role="listitem">
          <div class="profile-stat-num">${a.works.length}</div>
          <div class="profile-stat-label"
               data-ar="قطعة متاحة" data-en="Available Pieces">
            ${lang === 'ar' ? 'قطعة متاحة' : 'Available Pieces'}
          </div>
        </div>
        <div class="profile-stat" role="listitem">
          <div class="profile-stat-num"
               data-ar="${a.region.ar}" data-en="${a.region.en}">${a.region[lang]}</div>
          <div class="profile-stat-label" data-ar="المنطقة" data-en="Region">
            ${lang === 'ar' ? 'المنطقة' : 'Region'}
          </div>
        </div>
        <div class="profile-stat" role="listitem">
          <div class="profile-stat-num" aria-hidden="true">✦</div>
          <div class="profile-stat-label" data-ar="حرفي موثّق" data-en="Verified Artisan">
            ${lang === 'ar' ? 'حرفي موثّق' : 'Verified Artisan'}
          </div>
        </div>
      </div>

      <section class="works-section" aria-labelledby="works-h2">
        <div class="reveal">
          <span class="section-eyebrow"
                data-ar="معرض الأعمال" data-en="Works Gallery">
            ${lang === 'ar' ? 'معرض الأعمال' : 'Works Gallery'}
          </span>
          <h2 class="section-title" id="works-h2"
              data-ar="أعمال ${a.name.ar}" data-en="Works by ${a.name.en}">
            ${lang === 'ar' ? `أعمال ${a.name.ar}` : `Works by ${a.name.en}`}
          </h2>
        </div>
        <div class="works-grid" role="list" aria-label="${lang === 'ar' ? 'أعمال الحرفي' : 'Artisan works'}">
          ${worksHTML}
        </div>
      </section>`;

                    // Show content, remove skeleton
                    document.getElementById('artisan-skeleton').remove();
                    document.getElementById('artisan-content').removeAttribute('hidden');

                    initReveal();
                    window._onContentLoaded?.();

                    // Animations
                    gsap.from('.profile-name', {
                        opacity: 0,
                        y: 40,
                        duration: 0.9,
                        ease: 'power3.out',
                        delay: 0.2
                    });
                    gsap.from('.profile-story', {
                        opacity: 0,
                        y: 24,
                        duration: 0.8,
                        ease: 'power2.out',
                        delay: 0.35
                    });
                    gsap.from('.works-grid article', {
                        opacity: 0,
                        y: 50,
                        duration: 0.65,
                        stagger: 0.1,
                        ease: 'power2.out',
                        scrollTrigger: { trigger: '.works-grid', start: 'top 84%', once: true }
                    });

                    // Lang change re-render
                    window._onLangChange = () => loadArtisan();
                } catch (err) {
                    console.error(err);
                    document.getElementById('artisan-skeleton').innerHTML = `
      <div class="state-error--full">
        <p class="state-error__text"
           data-ar="تعذّر تحميل هذا الحرفي." data-en="Could not load this artisan.">
          تعذّر تحميل هذا الحرفي.
        </p>
        <a href="artisans.html" class="btn btn-primary"
           data-ar="العودة للحرفيين" data-en="Back to Artisans">العودة للحرفيين</a>
      </div>`;
                }
            }

            loadArtisan();
        </script>
    </body>
</html>

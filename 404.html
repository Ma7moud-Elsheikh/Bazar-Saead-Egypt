<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />

        <meta property="og:title" content="٤٠٤ — بازار صعيد مصر" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <meta name="theme-color" content="#B87333" />
        <meta
            property="og:image"
            content="https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=1200&h=630&fit=crop&auto=format"
        />
        <meta property="og:url" content="https://bazarsa3eed.com/404.html" />
        <link rel="canonical" href="https://bazarsa3eed.com/404.html" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <link rel="stylesheet" href="css/shared.css" />
    </head>
    <body class="page-dark">
        <div class="grain-overlay" aria-hidden="true"></div>
        <div id="cursor" aria-hidden="true"></div>
        <div id="cursor-follower" aria-hidden="true"></div>
        <div id="page-transition" aria-hidden="true"></div>

        <!-- Minimal navbar for 404 -->
        <header>
            <nav id="navbar" aria-label="التنقل الرئيسي"></nav>
        </header>
        <div id="mobile-menu" role="dialog" aria-modal="true" aria-label="قائمة التنقل"></div>

        <main id="main-content">
            <div class="e404-wrap" role="main">
                <div class="e404-bg-num" aria-hidden="true">404</div>

                <span class="e404-eyebrow" data-ar="خطأ ٤٠٤" data-en="Error 404">خطأ ٤٠٤</span>

                <h1 class="e404-title" data-ar="الصفحة غير موجودة" data-en="Page Not Found">
                    الصفحة غير موجودة
                </h1>

                <div class="e404-line" aria-hidden="true"></div>

                <p
                    class="e404-text"
                    data-ar="يبدو أن الصفحة التي تبحث عنها اختفت مثل أثر قلة في الرمال — ربما تغيّر رابطها، أو ربما لم تكن هنا أصلاً."
                    data-en="The page you're looking for has disappeared like pottery shards in the sand — maybe the link changed, or it was never here at all."
                >
                    يبدو أن الصفحة التي تبحث عنها اختفت مثل أثر قلة في الرمال — ربما تغيّر رابطها،
                    أو ربما لم تكن هنا أصلاً.
                </p>

                <div class="e404-actions">
                    <a
                        href="index.html"
                        class="btn btn-primary"
                        data-ar="العودة للرئيسية"
                        data-en="Back to Home"
                    >
                        العودة للرئيسية
                    </a>
                    <a
                        href="crafts.html"
                        class="btn btn-outline btn-outline--sand"
                        data-ar="استكشف الحرف"
                        data-en="Explore Crafts"
                    >
                        استكشف الحرف
                    </a>
                </div>

                <span class="e404-links-label" data-ar="أو اذهب إلى" data-en="Or go to">
                    أو اذهب إلى
                </span>
                <ul class="e404-links" aria-label="روابط سريعة">
                    <li>
                        <a href="artisans.html" data-ar="الحرفيون" data-en="Artisans">الحرفيون</a>
                    </li>
                    <li>
                        <a href="workshops.html" data-ar="ورش العمل" data-en="Workshops">
                            ورش العمل
                        </a>
                    </li>
                    <li>
                        <a href="about.html" data-ar="عن البازار" data-en="About">عن البازار</a>
                    </li>
                    <li>
                        <a href="contact.html" data-ar="تواصل معنا" data-en="Contact">تواصل معنا</a>
                    </li>
                </ul>
            </div>
        </main>

        <footer role="contentinfo"></footer>

        <script src="js/shared.js"></script>
        <script src="js/enhancements.js"></script>
        <script src="js/cart.js"></script>
        <script src="js/cart.js"></script>
        <script>
            // Entrance animation
            if (typeof gsap !== 'undefined') {
                const tl = gsap.timeline({ delay: 0.3 });
                tl.to('.e404-eyebrow', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' })
                    .to(
                        '.e404-title',
                        { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' },
                        '-=.3'
                    )
                    .to(
                        '.e404-line',
                        { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
                        '-=.2'
                    )
                    .to(
                        '.e404-text',
                        { opacity: 0.62, y: 0, duration: 0.7, ease: 'power2.out' },
                        '-=.3'
                    )
                    .to(
                        '.e404-actions',
                        { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' },
                        '-=.3'
                    )
                    .to(
                        '.e404-links-label',
                        { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
                        '-=.2'
                    )
                    .to(
                        '.e404-links',
                        { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
                        '-=.2'
                    );

                // Floating bg number
                gsap.to('.e404-bg-num', {
                    y: -30,
                    duration: 6,
                    ease: 'sine.inOut',
                    yoyo: true,
                    repeat: -1
                });
            }
        </script>
    </body>
</html>
